<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySQL Execution Plan Viewer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/neo.min.css">
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/lint/lint.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>

</head>

<body>

    <div class="main-container">
        <div class="toolbar d-flex align-items-center">
            <div class="d-flex align-items-center">
                <i class="bi bi-diagram-3-fill me-2" style="color:#3b82f6;font-size:18px;"></i>
                <h6 class="mb-0">MySQL<span class="fw-light"> Execution Plan Viewer</span></h6>
            </div>

            <div id="error-box" class="mx-3"></div>

            <div class="d-flex gap-2 align-items-center ms-auto">
                <button id="clear-btn" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-x-lg me-1"></i>Clear
                </button>
                <button id="generate-btn" class="btn btn-primary btn-sm" disabled>
                    <i class="bi bi-play-fill me-1"></i>Generate Graph
                </button>
                <button id="reset-btn" class="btn btn-outline-secondary btn-sm graph-ctrl" disabled>
                    <i class="bi bi-arrows-fullscreen me-1"></i>Fit
                </button>
                <button id="export-btn" class="btn btn-success btn-sm graph-ctrl" disabled>
                    <i class="bi bi-download me-1"></i>Export
                </button>
            </div>
        </div>

        <div class="workspace">
            <div id="input-pane">
                <div class="pane-header"><i class="bi bi-code-slash me-1"></i>EXPLAIN JSON Input</div>
                <textarea id="json-input"></textarea>
            </div>
            <div id="graph-pane">
                <div id="cy"></div>

                <div id="stats-bar"></div>

                <div id="legend">
                    <div
                        style="font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#64748b;margin-bottom:6px;">
                        Access Type</div>
                    <div class="legend-row">
                        <div class="legend-dot" style="background:#dc3545;"></div> Full Scan (ALL)
                    </div>
                    <div class="legend-row">
                        <div class="legend-dot" style="background:#f59e0b;"></div> Index Scan
                    </div>
                    <div class="legend-row">
                        <div class="legend-dot" style="background:#10b981;"></div> Range / Ref
                    </div>
                    <div class="legend-row">
                        <div class="legend-dot" style="background:#3b82f6;"></div> eq_ref / const
                    </div>
                    <div class="legend-row">
                        <div class="legend-dot" style="background:#8b5cf6;"></div> Derived / Other
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
